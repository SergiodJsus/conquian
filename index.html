// Mano en abanico: se encima cuando no cabe y se curva un poco hacia las orillas.
function fitHand(){
  const el=document.getElementById('hand');if(!el)return;
  const cards=[...el.querySelectorAll('.card')],n=cards.length;if(!n)return;
  cards.forEach(c=>{c.style.marginLeft=''});
  const w=cards[0].offsetWidth,avail=el.clientWidth,gap=8;
  const ml=n>1&&n*w+(n-1)*gap>avail?(avail-n*w)/(n-1):gap,mid=(n-1)/2;
  cards.forEach((c,i)=>{
    if(i)c.style.marginLeft=ml+'px';
    const t=mid?(i-mid)/mid:0;
    c.style.setProperty('--rot',(t*5).toFixed(2)+'deg');
    c.style.setProperty('--arc',(t*t*9).toFixed(1)+'px');
  });
}
// Busca el tamaño de carta más grande con el que toda la mesa cabe en la pantalla.
function fitScreen(){
  const g=view.querySelector('.game');if(!g)return;
  g.classList.remove('scroll');
  const fits=k=>{g.style.setProperty('--k',k);fitHand();return g.scrollHeight<=g.clientHeight+1};
  if(fits(1))return;
  let lo=.45,hi=1;
  for(let i=0;i<7;i++){const mid=(lo+hi)/2;if(fits(mid))lo=mid;else hi=mid}
  // En pantallas muy chiquitas, mejor dejar deslizar que cortar la mesa.
  if(!fits(lo))g.classList.add('scroll');
}
window.addEventListener('resize',fitScreen);

// ===== Arrastrar cartas =====
// De la mano se arrastra para acomodarla. Al armar juegos, cualquier carta tuya se arrastra a un juego, a uno nuevo
// o de regreso a la mano; y cuando te ofrecen una carta, soltarla (o soltar una tuya) en tus juegos es como "Usar carta".
let drag=null,suppressUntil=0,hot=null;
const canUseNow=()=>{const S=app.S;return !!S&&app.view==='game'&&!app.ui.build&&!app.ui.busy&&S.phase==='decide'&&actor(S)===app.me&&linked()};
// Si arrastras una carta que tenías marcada junto con otras, se van todas las marcadas.
function dragCards(d){const ws=app.ui.build;return ws&&ws.sel.length>1&&ws.sel.includes(d.c)?ws.sel.slice():[d.c]}
function setHot(el){if(hot===el)return;if(hot)hot.classList.remove('drop-on');hot=el||null;if(hot)hot.classList.add('drop-on')}
function dropTarget(px,py,d){
  const ws=app.ui.build,mm=$('#my-melds'),hand=$('#hand');
  const mz=mm&&mm.parentElement,hz=hand&&hand.parentElement;
  const over=(el,pad=0)=>{if(!el)return false;const r=el.getBoundingClientRect();return px>=r.left-pad&&px<=r.right+pad&&py>=r.top-pad&&py<=r.bottom+pad};
  const meldAt=sel=>[...view.querySelectorAll(sel)].find(m=>over(m,8));
  if(ws){
    if(d.src==='face')return null;
    const m=meldAt('#my-melds .meld.ws');if(m)return {kind:'meld',el:m,i:+m.dataset.i};
    const nw=view.querySelector('#my-melds .meld-new');
    if(over(nw,8)||over(mz))return {kind:'new',el:nw};
    if(d.src==='meld'&&over(hz))return {kind:'hand',el:dragCards(d).every(c=>ws.fromHand.includes(c))?hand:null};
    return null;
  }
  if(!canUseNow()||d.src==='meld')return null;
  const m=meldAt('#my-melds .meld');if(m)return {kind:'use',el:m,i:+m.dataset.i};
  if(over(mz))return {kind:'use',el:mm,i:'face'};
  if(d.src==='hand'&&over($('#face'),8))return {kind:'use',el:$('#face'),i:'face'};
  return null;
}
view.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  const el=e.target.closest('#hand .card, #my-melds.building .meld.ws .card, #face .card');if(!el)return;
  const src=el.closest('#hand')?'hand':el.closest('#face')?'face':'meld';
  if(src==='face'&&!canUseNow())return;
  drag={el,src,c:el.dataset.k,pid:e.pointerId,x0:e.clientX,y0:e.clientY,gx:0,gy:0,active:false};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8)return;
    if(!drag.el.isConnected){drag=null;return}
    drag.active=true;
    drag.el.getAnimations().forEach(a=>a.cancel());
    drag.el.classList.add('dragging');
    try{drag.el.setPointerCapture(drag.pid)}catch{}
    const r=drag.el.getBoundingClientRect();drag.gx=drag.x0-r.left;drag.gy=drag.y0-r.top;
    const cs=dragCards(drag);
    if(cs.length>1){
      drag.el.dataset.more='+'+(cs.length-1);
      view.querySelectorAll('[data-k]').forEach(c=>{if(c!==drag.el&&cs.includes(c.dataset.k))c.classList.add('riding')});
    }
  }
  e.preventDefault();
  moveDrag(e.clientX,e.clientY);
},{passive:false});
function moveDrag(px,py){
  const el=drag.el,hand=el.parentElement;
  const place=()=>{el.style.transform='none';const r=el.getBoundingClientRect();el.style.transform=`translate(${px-drag.gx-r.left}px,${py-drag.gy-r.top}px)`};
  place();
  const t=dropTarget(px,py,drag);setHot(t&&t.el);
  // Encima de tus juegos la mano se queda quieta; solo se reacomoda cuando la carta anda por la mano.
  if(drag.src!=='hand'||t)return;
  const all=[...hand.querySelectorAll('.card')],sibs=all.filter(c=>c!==el);
  let idx=sibs.findIndex(c=>{const r=c.getBoundingClientRect();return px<r.left+r.width/2});
  if(idx<0)idx=sibs.length;
  if(idx===all.indexOf(el))return;
  const before=new Map(sibs.map(c=>[c,c.getBoundingClientRect().left]));
  hand.insertBefore(el,sibs[idx]||null);
  fitHand();place();
  for(const c of sibs){const d=before.get(c)-c.getBoundingClientRect().left;if(Math.abs(d)>1)c.animate([{transform:`translateX(${d}px)`},{transform:'none'}],{duration:180,easing:'ease-out'})}
}
function endDrag(e){
  if(!drag)return;
  if(e&&e.pointerId!==drag.pid)return;
  const d=drag;drag=null;
  setHot(null);
  if(!d.active)return;
  suppressUntil=performance.now()+350;
  const el=d.el;if(!el.isConnected)return;
  // Al volver a dibujar la mesa, la carta vuela desde donde la soltaste hasta su lugar nuevo.
  if(e&&e.type==='pointerup'){const t=dropTarget(e.clientX,e.clientY,d);if(t&&dropOn(d,t,e.clientX))return}
  view.querySelectorAll('.card.riding').forEach(c=>c.classList.remove('riding'));
  delete el.dataset.more;
  const from=el.getBoundingClientRect();
  el.classList.remove('dragging');el.style.transform='';
  if(d.src==='hand')fitHand();
  const to=el.getBoundingClientRect();
  if(!reduceMotion)el.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px)`},{transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  if(d.src==='hand'){setOrder([...el.parentElement.querySelectorAll('.card')].map(c=>c.dataset.k));SFX.card(.12)}
}
// Devuelve false si ahí no se puede soltar: la carta regresa a donde estaba.
function dropOn(d,t,px){
  if(t.kind==='use'){
    startBuild(false);
    const ws=app.ui.build,fi=ws.melds.length-1,to=t.i==='face'?fi:t.i;
    if(d.src==='hand'||to!==fi)wsMove([d.c],to);
    SFX.card(.2);render();return true;
  }
  const ws=app.ui.build;if(!ws)return false;
  const cards=dragCards(d);
  if(t.kind==='hand'){
    if(cards.some(c=>!ws.fromHand.includes(c))){toast('Solo las cartas de tu mano pueden regresar a la mano.');return false}
    const hc=[...view.querySelectorAll('#hand .card')],ids=hc.map(c=>c.dataset.k);
    let at=hc.findIndex(c=>{const r=c.getBoundingClientRect();return px<r.left+r.width/2});if(at<0)at=ids.length;
    wsMove(cards,'hand');ids.splice(at,0,...cards);setOrder(ids);
  }else{
    if(t.kind==='meld'&&ws.melds[t.i]&&cards.every(c=>ws.melds[t.i].includes(c)))return false;
    wsMove(cards,t.kind==='new'?'new':t.i);
  }
  SFX.card(.2);render();return true;
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);

// ===== Armar juegos (cuando usas una carta) =====
function startBuild(show=true){
  const S=app.S,me=app.me;
  app.ui.build={face:S.face.c,melds:S.melds[me].map(m=>m.slice()).concat([[S.face.c]]),hand:S.hands[me].slice(),fromHand:S.hands[me].slice(),sel:[],moves:0};
  if(show)render();
}
// Mueve cartas a un juego (su número), a uno nuevo ('new') o a la mano ('hand'). No dibuja.
function wsMove(cards,target){
  const ws=app.ui.build;if(!ws||!cards.length)return false;
  if(target==='hand'&&cards.some(c=>!ws.fromHand.includes(c))){toast('Solo las cartas de tu mano pueden regresar a la mano.');return false}
  const set=new Set(cards);
  ws.melds=ws.melds.map(m=>m.filter(c=>!set.has(c)));
  ws.hand=ws.hand.filter(c=>!set.has(c));
  if(target==='hand')ws.hand.push(...cards);
  else if(target!=='new'&&ws.melds[+target])ws.melds[+target].push(...cards);
  else ws.melds.push([...cards]);
  ws.melds=ws.melds.filter(m=>m.length).map(sortMeld);
  ws.sel=ws.sel.filter(c=>!set.has(c));ws.moves++;
  return true;
}
function wsPut(target){
  const ws=app.ui.build;if(!ws)return;
  if(!ws.sel.length){if(target==='new')toast('Arrastra una carta hasta aquí, o tócala primero.');return}
  if(wsMove(ws.sel.slice(),target))render();
}

// ===== Jugadas =====
let busyT=null;
function apply(p,a){
  const base=app.S;let N;
  try{N=act(base,p,a)}catch(e){toast(e.message);return}
  app.ui.build=null;app.ui.paySel=null;
  if(app.mode==='local'){app.S=N;saveLocal();render();return}
  if(!linked()){toast(netProblem());render();return}
  if(net.role==='host'){app.S=N;saveHost();sendState();render();return}
  // Invitado: la jugada la valida y aplica quien creó la mesa.
  app.ui.busy=true;render();
  send(topic.h(net.code),{t:'act',id:net.id,a});
  clearTimeout(busyT);
  busyT=setTimeout(()=>{if(app.ui.busy&&app.S===base){app.ui.busy=false;toast('La mesa no respondió. Inténtalo otra vez.');render()}},9000);
}
// Solo la computadora juega sola; tú haces todo a mano.
let autoTimer=null,autoKey='';
function scheduleAuto(){
  const S=app.S;
  if(app.view!=='game'||!S||app.mode!=='local'){clearTimeout(autoTimer);autoKey='';return}
  const key=S.round+'|'+S.seq;
  if(key===autoKey)return;
  clearTimeout(autoTimer);autoKey=key;
  const a=aiChoose(S,1);if(!a)return;
  const wait=a.t==='force'?1000+Math.random()*1400
    :S.phase==='flip'?(S.callable&&S.callable.by===1?1800:900)
    :S.phase==='discard'?1000:950;
  autoTimer=setTimeout(()=>{if(app.S&&app.S.seq===S.seq&&app.S.round===S.round)apply(1,a)},wait);
}
function goHome(){
  closeNet();net.role=null;net.code=null;
  app.mode=null;app.view='home';app.ui={build:null,paySel:null,busy:false};
  render();window.scrollTo(0,0);
}
function startGame(){app.view='game';app.ui={build:null,paySel:null,busy:false};render();window.scrollTo(0,0)}

// ===== En línea (las jugadas pasan por un servidor MQTT público) =====
// Quien crea la mesa guarda la partida y valida cada jugada; a cada invitado solo le llega su vista.
// No hay conexión directa entre dispositivos: en redes de escuela o trabajo casi nunca se pueden ver entre sí,
// y por WebSocket sí pasan. Si un servidor no responde, se prueba el siguiente.
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://public:public@public.cloud.shiftr.io'];
const ROOT='conquian-mx/v2/';
// Cada BEAT todos dicen "sigo aquí"; si alguien calla LOST, se le da por desconectado. Con la pestaña en segundo plano
// el navegador puede espaciar los avisos hasta un minuto, por eso el margen. Cerrar la página se sabe al instante.
const MAXP=3,BEAT=15000,LOST=90000;
// Una mesa cuyo creador lleva tanto tiempo fuera ya se da por cerrada.
const TABLE_TTL=6*3600e3;
const topic={
  p:c=>ROOT+c+'/p',          // aviso de que la mesa existe (el servidor lo guarda para quien llegue); off: quien la creó no está en la página
  h:c=>ROOT+c+'/h',          // mensajes para quien creó la mesa
  g:(c,id)=>ROOT+c+'/g/'+id  // mensajes para un invitado
};
// seats: quién ocupa cada lugar (lo lleva quien creó la mesa; el lugar 0 es suyo). on: quién está conectado, según le avisan al invitado.
const net={role:null,client:null,up:false,code:null,names:[],me:'',id:'',sess:'',seats:[],on:[],hostSeen:0,found:false,joined:false,key:'',status:'',run:0,beat:null,announced:false,taken:false};
const fresh=g=>!!g&&Date.now()-g.seen<LOST;
const oldTable=m=>!m.at||Date.now()-m.at>TABLE_TTL;
// Tu propia conexión con el servidor de mesas.
function online(){return app.mode!=='p2p'||net.up}
// Si quien creó la mesa está en la página (lo que ve un invitado).
const hostLive=()=>Date.now()-net.hostSeen<LOST;
// Lugares de la partida cuyo jugador no está conectado.
function missing(){
  if(app.mode!=='p2p'||!app.S)return [];
  return app.S.hands.map((_,i)=>i).filter(i=>i!==app.me&&!(net.role==='host'?fresh(net.seats[i]):i===0?hostLive():net.on[i]!==false));
}
function linked(){return online()&&!missing().length}
function netProblem(){
  if(!online())return 'Sin conexión con el servidor de mesas. Reintentando…';
  const m=missing();
  return `${joinNames(m.map(p=>nameOf(p)))} ${m.length>1?'no están conectados':'no está conectado'}.`;
}
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,20);
function myName(){const n=cleanName(($('#my-name')||{}).value??store.get('name',''));if(n)store.set('name',n);return n||store.get('name','')||(net.role==='host'?'Anfitrión':'Invitado')}
function invitedCode(){const m=location.hash.match(/^#([A-Za-z0-9]{4})$/);return m?m[1].toUpperCase():null}
function inviteLink(){return /^https?:$/.test(location.protocol)?location.origin+location.pathname+'#'+net.code:''}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[rnd(A.length)];return s}
function genId(){const A='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<12;i++)s+=A[rnd(A.length)];return s}
// Cada pestaña es un jugador distinto; si recarga, sigue siendo el mismo.
function tabId(){try{let v=sessionStorage.getItem('conquian.pid');if(!v){v=genId();sessionStorage.setItem('conquian.pid',v)}return v}catch{return net.id||genId()}}
function pub(c,t,m,{qos=1,retain=false}={}){
  if(!c||!c.connected)return false;
  try{c.publish(t,m==null?'':JSON.stringify(m),{qos,retain})}catch{return false}
  return true;
}
const send=(t,m,o)=>pub(net.client,t,m,o);
// "will" es lo que el servidor publica solo si la conexión se corta sin despedirse (p. ej. al cerrar la página).
function connectBroker(url,will){
  return new Promise(res=>{
    let c;
    try{c=mqtt.connect(url,{connectTimeout:6000,reconnectPeriod:2000,keepalive:30,clean:true,will})}catch{res(null);return}
    c.on('error',()=>{});
    const t=setTimeout(()=>{try{c.end(true)}catch{}res(null)},7000);
    c.once('connect',()=>{clearTimeout(t);res(c)});
  });
}
function wire(c){
  net.client=c;net.up=true;
  c.on('message',(t,buf)=>{
    if(net.client!==c)return;
    let m=null;const s=buf.toString();
    if(s){try{m=JSON.parse(s)}catch{return}}
    if(net.role==='host')hostOnMsg(t,m);else guestOnMsg(t,m);
  });
  // Si se va el internet, la librería se reconecta sola; al volver, cada quien se reporta.
  c.on('connect',()=>{
    if(net.client!==c)return;
    net.up=true;
    if(net.role==='host')announce();else hello();
    netChanged();
  });
  c.on('close',()=>{if(net.client===c){net.up=false;netChanged()}});
}
function closeNet(){
  net.run++;clearInterval(net.beat);net.beat=null;
  const c=net.client;net.client=null;net.up=false;
  if(c){
    if(net.role==='host'&&net.announced)pub(c,topic.p(net.code),null,{retain:true});
    else if(net.role==='guest')pub(c,topic.h(net.code),{t:'bye',id:net.id},{qos:0});
    try{c.end(false)}catch{}
  }
  net.announced=false;net.key='';
}
function startBeat(){
  clearInterval(net.beat);let last=Date.now();
  net.beat=setInterval(()=>{
    if(Date.now()-last>=BEAT){last=Date.now();if(net.role==='host')announce();else send(topic.h(net.code),{t:'ping',id:net.id},{qos:0})}
    // En la sala, quien se fue sin despedirse deja su lugar.
    if(net.role==='host'&&!app.S){const k=net.seats.length;for(let i=k-1;i>0;i--)if(!fresh(net.seats[i]))drop(i);if(net.seats.length!==k)sync()}
    netChanged();
  },BEAT/3);
}
const netKey=()=>`${online()}|${net.role==='guest'&&hostLive()}|${missing()}`;
// Vuelve a pintar; si alguien se acaba de desconectar, avisa.
function refresh(){
  const k=netKey(),changed=k!==net.key;net.key=k;
  if(changed&&app.view==='game'&&app.S&&!linked()){app.ui.busy=false;toast(netProblem())}
  render();
}
// Quien creó la mesa les manda a todos cómo va (la partida, o quién está en la sala).
function sync(){if(net.role==='host'){if(app.S)sendState();else sendLobby()}refresh()}
function netChanged(){if(netKey()!==net.key){if(net.role==='host')sync();else refresh()}}
function setStatus(s){net.status=s;if(app.view==='loading')render()}
// Revisa cond() hasta que se cumpla o pasen ms; mientras, repite every() cada step. Se cancela si cambia la conexión.
function until(cond,ms,run,step=0,every=null){
  return new Promise(res=>{
    const t0=Date.now();let last=t0;
    (function tick(){
      if(net.run!==run)return res(false);
      if(cond())return res(true);
      const now=Date.now();
      if(now-t0>=ms)return res(false);
      if(every&&step&&now-last>=step){last=now;every()}
      setTimeout(tick,150);
    })();
  });
}
function redact(S,seat){
  if(S.phase==='over')return S;
  const R=clone(S),n=R.hands.length;
  R.hands=R.hands.map((h,i)=>i===seat?h:h.map(()=>'??'));R.deck=R.deck.map(()=>'??');
  // En el cambio solo se sabe quién ya escogió; de lo que se dieron, solo ves la carta que diste y la que te dieron.
  if(R.swap)R.swap=R.swap.map((c,i)=>i===seat||c==null?c:'??');
  if(R.got)R.got=R.got.map((c,i)=>i===seat||i===(seat+1)%n?c:'??');
  return R;
}
function saveHost(){if(net.role==='host')store.set('host',{code:net.code,S:app.S,names:net.names,seats:net.seats.map(g=>g&&g.id)})}
const presence=(off=false)=>({h:net.id,s:net.sess,n:net.names[0],at:Date.now(),...(off?{off:1}:{})});
function announce(){if(send(topic.p(net.code),presence(),{retain:true}))net.announced=true}
function sendState(){
  if(net.role!=='host'||!app.S)return;
  const on=net.seats.map((g,i)=>i===0||fresh(g));
  net.seats.forEach((g,i)=>{if(i&&fresh(g))send(topic.g(net.code,g.id),{t:'state',S:redact(app.S,i),names:net.names,on,seat:i})});
}
function sendLobby(){net.seats.forEach((g,i)=>{if(i&&g)send(topic.g(net.code,g.id),{t:'lobby',names:net.names,seat:i})})}
function hello(){send(topic.h(net.code),{t:'hello',id:net.id,name:net.me})}
function drop(i){net.seats.splice(i,1);net.names.splice(i,1)}

async function hostTable(code,S,seatIds){
  closeNet();
  const run=net.run,myN=myName();
  net.role='host';net.code=code;net.id=tabId();net.sess=genId();
  // Al reabrir, cada lugar espera a quien lo tenía; si llega alguien nuevo, ocupa el de quien no regrese.
  net.seats=S?S.hands.map((_,i)=>i&&seatIds&&seatIds[i]?{id:seatIds[i],seen:0}:null):[null];
  net.names=S?S.hands.map((_,i)=>i?net.names[i]||'':myN):[myN];
  app.mode='p2p';app.me=0;app.S=S||null;
  app.ui={build:null,paySel:null,busy:false};net.status='Abriendo la mesa…';app.view='loading';render();
  let c=null;
  // Si el celular congela la página (p. ej. al irse a WhatsApp a mandar el link), la mesa no se borra:
  // queda marcada como "fuera" y quien llegue espera a que vuelva.
  for(const url of BROKERS){
    c=await connectBroker(url,{topic:topic.p(code),payload:JSON.stringify(presence(true)),qos:1,retain:true});
    if(net.run!==run){if(c)c.end(true);return}
    if(c)break;
  }
  if(!c){toast('No se pudo conectar al servidor de mesas. Revisa tu internet.');goHome();return}
  wire(c);net.taken=false;
  try{await c.subscribeAsync([topic.p(code),topic.h(code)],{qos:1})}catch{}
  // Si otra mesa abierta ya usa ese código, se escoge otro.
  if(!S&&await until(()=>net.taken,1000,run)){hostTable(genCode());return}
  if(net.run!==run)return;
  announce();saveHost();startBeat();
  app.view=S?'game':'wait';refresh();window.scrollTo(0,0);
}
// Reparte con quienes estén en la sala; quien creó la mesa es mano.
function startOnline(){
  if(net.role!=='host'||app.S||net.seats.length<2)return;
  const n=net.seats.length;
  app.S=deal({...app.cfg,players:n},n-1);app.ui={build:null,paySel:null,busy:false};
  app.view='game';saveHost();sync();window.scrollTo(0,0);
}
function hostOnMsg(t,m){
  if(t===topic.p(net.code)){
    // Otra mesa abierta con el mismo código; o llegó nuestro propio "me fui" de una conexión vieja: se corrige.
    if(m&&m.h&&m.h!==net.id){if(!oldTable(m))net.taken=true}
    else if((!m||m.off)&&net.announced)announce();
    return;
  }
  if(t!==topic.h(net.code)||!m||typeof m!=='object'||typeof m.id!=='string')return;
  let i=net.seats.findIndex(g=>g&&g.id===m.id);
  if(m.t==='hello'){
    const name=cleanName(m.name)||'Invitado';
    if(i<0){
      // En la sala entra quien quepa; con la partida empezada, solo al lugar de alguien que se desconectó.
      i=app.S?net.seats.findIndex((g,k)=>k>0&&!fresh(g)):net.seats.length<MAXP?net.seats.length:-1;
      if(i<0){send(topic.g(net.code,m.id),{t:'full',msg:app.S?'Esa mesa ya está jugando y no hay lugar libre.':`Esa mesa ya tiene ${MAXP} jugadores.`});return}
    }
    const back=fresh(net.seats[i]);
    net.seats[i]={id:m.id,seen:Date.now()};net.names[i]=name;
    saveHost();sync();
    if(!back)toast(`${name} entró a la mesa.`);
    if(!app.S&&net.seats.length===MAXP)startOnline();
    return;
  }
  if(i<0)return;
  const g=net.seats[i];
  if(m.t==='bye'){
    if(app.S)g.seen=0;else{toast(`${net.names[i]} salió de la mesa.`);drop(i)}
    sync();return;
  }
  const was=fresh(g);g.seen=Date.now();
  if(m.t==='act'&&app.S){
    let N;
    try{N=act(app.S,i,m.a)}catch(e){send(topic.g(net.code,g.id),{t:'err',msg:e.message});sendState();return}
    app.S=N;app.ui.build=null;app.ui.paySel=null;saveHost();sendState();render();
  }else if(!was)sync();
}
async function joinTable(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){toast('El código tiene 4 letras o números.');return}
  if(typeof mqtt==='undefined'){toast('No se pudo cargar la conexión. Recarga la página.');return}
  closeNet();
  const run=net.run,myN=myName();
  net.role='guest';net.code=code;net.id=tabId();net.sess='';net.me=myN;net.names=[];net.on=[];net.hostSeen=0;net.found=false;net.joined=false;
  app.mode='p2p';app.me=1;app.S=null;app.ui={build:null,paySel:null,busy:false};
  net.status='Conectando con el servidor de mesas…';app.view='loading';render();
  store.set('guest',code);
  if(invitedCode())history.replaceState(null,'',location.pathname+location.search);
  // Busca la mesa en cada servidor hasta encontrarla.
  let reached=false;
  for(const url of BROKERS){
    const c=await connectBroker(url,{topic:topic.h(code),payload:JSON.stringify({t:'bye',id:net.id}),qos:0,retain:false});
    if(net.run!==run){if(c)c.end(true);return}
    if(!c)continue;
    reached=true;wire(c);setStatus(`Buscando la mesa ${code}…`);
    try{await c.subscribeAsync([topic.p(code),topic.g(code,net.id)],{qos:1})}catch{}
    if(await until(()=>net.found,3500,run))break;
    if(net.run!==run)return;
    net.client=null;net.up=false;try{c.end(true)}catch{}
  }
  if(!net.client){toast(reached?`No hay ninguna mesa abierta con el código ${code}.`:'No se pudo conectar al servidor de mesas. Revisa tu internet.');goHome();return}
  // Saluda hasta que la mesa conteste; si quien la creó salió un momento de la página, se le espera.
  const status=()=>setStatus(hostLive()?`Entrando a la mesa ${code}…`:`Encontré la mesa ${code}, pero ${nameOf(0)} no está en la página ahora. Entras en cuanto vuelva…`);
  status();hello();
  if(await until(()=>net.joined,120000,run,2500,()=>{hello();status()})){startBeat();return}
  if(net.run!==run)return;
  toast(`${nameOf(0)} no contestó. Pídele que abra la página de la mesa y vuelve a intentar.`);goHome();
}
function guestOnMsg(t,m){
  if(t===topic.p(net.code)){
    const back=!hostLive();
    if(m&&m.h&&!oldTable(m))net.found=true;
    net.hostSeen=m&&m.h&&!m.off?Date.now():0;
    if(m&&m.n&&!net.names[0])net.names[0]=cleanName(m.n);
    // Si quien creó la mesa la volvió a abrir o regresó a la página, puede que ya no sepa de ti: te reportas.
    if(m&&m.s&&m.s!==net.sess){const again=!!net.sess;net.sess=m.s;if(again)hello()}
    else if(back&&hostLive()&&net.joined)hello();
    netChanged();
    return;
  }
  if(!m||typeof m!=='object')return;
  net.hostSeen=Date.now();
  if(Array.isArray(m.names))net.names=m.names.map(cleanName);
  const seat=Number.isInteger(m.seat)&&m.seat>0&&m.seat<MAXP?m.seat:app.me;
  if(m.t==='state'&&m.S&&Array.isArray(m.S.hands)&&m.S.hands[seat]){
    const S=m.S;
    if(!app.S||app.S.seq!==S.seq||app.S.round!==S.round||app.me!==seat){app.ui.build=null;app.ui.paySel=null}
    app.me=seat;app.S=S;net.on=Array.isArray(m.on)?m.on:[];net.joined=true;
    app.ui.busy=false;clearTimeout(busyT);
    const was=app.view;app.view='game';refresh();
    if(was!=='game')window.scrollTo(0,0);
  }else if(m.t==='lobby'){app.me=seat;app.S=null;net.joined=true;app.view='wait';refresh()}
  else if(m.t==='err'){app.ui.busy=false;toast(String(m.msg||'Jugada no válida.'));render()}
  else if(m.t==='full'){toast(String(m.msg||'Esa mesa ya está llena.'));store.del('guest');goHome()}
}

// ===== Eventos =====
function copyText(text,selId){
  const pick=()=>{const el=$('#'+selId);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Ya está seleccionado: cópialo para compartirlo.')};
  try{navigator.clipboard.writeText(text).then(()=>toast('Copiado. Ya puedes pegarlo y mandarlo.'),pick)}catch{pick()}
}
function showDlg(title,html){
  const d=$('#rules-dlg');$('#rules-dlg-t').textContent=title;$('#rules-dlg-body').innerHTML=html;
  if(!d.open)d.showModal();
}
const menuHTML=()=>`<div class="menu">
  <button type="button" class="btn second" data-a="sound" aria-pressed="${app.sound}">Sonido: ${app.sound?'prendido':'apagado'}</button>
  <button type="button" class="btn second" data-a="history">Últimas jugadas</button>
  <button type="button" class="btn second" data-a="rules">Reglas</button>
  <button type="button" class="btn ghost" data-a="home">Salir de la mesa</button>
</div>`;
const H={
  home:()=>{const d=$('#rules-dlg');if(d.open)d.close();goHome()},
  rules:()=>showDlg('Cómo se juega',rulesHTML()),
  menu:()=>showDlg('Menú',menuHTML()),
  history:()=>{
    const L=app.S?app.S.log.slice().reverse():[];
    showDlg('Últimas jugadas',L.length?`<ol class="log">${L.map(e=>`<li>${logText(e)}</li>`).join('')}</ol>`:'<p class="sub">Todavía no hay jugadas en esta mano.</p>');
  },
  sound:()=>{app.sound=!app.sound;store.set('sound',app.sound);if(app.sound)SFX.card();showDlg('Menú',menuHTML())},
  'rules-close':()=>$('#rules-dlg').close(),
  'local-new':()=>{closeNet();net.role=null;net.code=null;app.mode='local';app.me=0;app.S=deal(app.cfg,1);saveLocal();startGame()},
  'local-continue':()=>{const S=loadLocal();if(!S)return;closeNet();net.role=null;net.code=null;app.mode='local';app.me=0;app.S=S;startGame()},
  'cfg-hand':t=>{app.cfg.hand=+t.dataset.n;store.set('cfg',app.cfg);render()},
  create:()=>{if(typeof mqtt==='undefined'){toast('No se pudo cargar la conexión. Recarga la página.');return}if(invitedCode())history.replaceState(null,'',location.pathname+location.search);hostTable(genCode())},
  reopen:()=>{const h=store.get('host',null);if(!h||!h.S)return;net.names=h.names||[];hostTable(h.code,h.S,h.seats)},
  start:()=>startOnline(),
  rejoin:()=>joinTable(net.code||store.get('guest','')),
  'cancel-host':()=>{store.del('host');goHome()},
  'copy-invite':()=>{const link=inviteLink();copyText(link||net.code,link?'linkbox':'bigcode')},
  flip:()=>apply(app.me,{t:'flip'}),
  use:()=>startBuild(),
  pass:()=>apply(app.me,{t:'pass'}),
  force:()=>apply(app.me,{t:'force'}),
  tap:t=>{
    const c=t.dataset.c,ws=app.ui.build;
    if(ws){ws.sel=ws.sel.includes(c)?ws.sel.filter(x=>x!==c):[...ws.sel,c];render();return}
    const S=app.S;
    if(((S.phase==='discard'&&S.turn===app.me)||swapWaiting(S,app.me))&&!app.ui.busy){app.ui.paySel=app.ui.paySel===c?null:c;render()}
  },
  give:()=>{if(app.ui.paySel)apply(app.me,{t:'swap',c:app.ui.paySel})},
  put:t=>wsPut(t.dataset.i),
  'b-confirm':()=>{const ws=app.ui.build;if(ws)apply(app.me,{t:'take',melds:ws.melds,hand:ws.hand})},
  'b-cancel':()=>{app.ui.build=null;render()},
  pay:()=>{if(app.ui.paySel)apply(app.me,{t:'pay',c:app.ui.paySel})},
  next:()=>apply(app.me,{t:'next'}),
  sort:t=>{
    app.sortBy=t.dataset.by;store.set('sort',app.sortBy);
    app.order={key:orderKey(),list:sortCards(currentHand(),app.sortBy)};store.set('order',app.order);
    render();
  }
};
document.addEventListener('click',e=>{
  if(performance.now()<suppressUntil&&view.contains(e.target)){e.preventDefault();return}
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const fn=H[t.dataset.a];if(fn){e.preventDefault();fn(t)}
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest&&e.target.closest('#hand .card');
  if(!el||!(e.key==='ArrowLeft'||e.key==='ArrowRight')||!(e.shiftKey||e.altKey))return;
  e.preventDefault();
  const ids=[...$('#hand').querySelectorAll('.card')].map(c=>c.dataset.k),i=ids.indexOf(el.dataset.k),j=i+(e.key==='ArrowLeft'?-1:1);
  if(j<0||j>=ids.length)return;
  [ids[i],ids[j]]=[ids[j],ids[i]];setOrder(ids);render();
  const n=view.querySelector(`#hand [data-k="${el.dataset.k}"]`);if(n)n.focus();
});
document.addEventListener('change',e=>{
  if(e.target.id==='cfg-obligar'){app.cfg.obligar=e.target.checked;store.set('cfg',app.cfg)}
  if(e.target.id==='cfg-cambio'){app.cfg.cambio=e.target.checked;store.set('cfg',app.cfg)}
  if(e.target.id==='sound'){app.sound=e.target.checked;store.set('sound',app.sound);if(app.sound)SFX.card()}
  if(e.target.id==='my-name'){store.set('name',cleanName(e.target.value))}
});
document.addEventListener('submit',e=>{
  if(e.target.matches('[data-form="join"]')){e.preventDefault();joinTable($('#join-code').value)}
});
$('#rules-dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
window.addEventListener('hashchange',()=>{if(app.view==='home')render()});

render();
</script>
</body>
</html>
