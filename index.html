<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conquián</title>
<meta name="description" content="Juega Conquián con baraja española contra la computadora o en línea con hasta dos amigos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Ccircle cx='10' cy='10' r='9' fill='%23ad7a04'/%3E%3Ccircle cx='10' cy='10' r='5.9' fill='none' stroke='%23fbf7ec' stroke-width='1.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  /* Layout: una sola columna de mesa (rival arriba, monte y carta al centro, tu mano abajo) sobre un fondo de azulejo de talavera */
  --bg:#edf0f8;
  --tile:#d9e0f2;
  --surface:#ffffff;
  --surface-2:#f3f5fb;
  --ink:#141f3d;
  --muted:#59648a;
  --cobalt:#1f3f9c;
  --cobalt-ink:#ffffff;
  --marigold:#e07b0c;
  --marigold-ink:#201300;
  --line:rgba(31,63,156,.17);
  --paper:#fbf7ec;
  --paper-edge:#d6ccb3;
  --card-ink:#231f17;
  --back:#1f3f9c;
  --back-2:#f0b04a;
  --oros:#ad7a04;
  --copas:#bf2a2e;
  --espadas:#1f4c9c;
  --bastos:#2c7a35;
  --ok:#23773a;
  --bad:#b3261e;
  --shadow:0 1px 2px rgba(20,30,70,.16),0 4px 12px rgba(20,30,70,.12);
  --f-display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1430; --tile:#122049; --surface:#14214b; --surface-2:#0f1a3d; --ink:#e7ebf7; --muted:#9ba6ca;
    --cobalt:#8ea9ff; --cobalt-ink:#0b1430; --marigold:#f59d38; --marigold-ink:#201300; --line:rgba(150,175,255,.18);
    --paper:#efe7d3; --paper-edge:#b8ad90; --back:#27479f; --back-2:#f0a640; --ok:#6fc77f; --bad:#ff8f84;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 0 0,var(--tile) 0 9px,transparent 10px),
    radial-gradient(circle at 100% 0,var(--tile) 0 9px,transparent 10px),
    radial-gradient(circle at 0 100%,var(--tile) 0 9px,transparent 10px),
    radial-gradient(circle at 100% 100%,var(--tile) 0 9px,transparent 10px),
    radial-gradient(circle at 50% 50%,transparent 0 13px,var(--tile) 14px 15.5px,transparent 16.5px);
  background-size:56px 56px;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:1040px;margin:0 auto}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--cobalt);background:none;border:0;cursor:pointer;padding:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
small{color:var(--muted);font-size:13px}

/* Botones */
.btn{font:700 15px/1.1 var(--f-body);border-radius:999px;padding:12px 18px;border:1.5px solid transparent;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;transition:scale .1s ease,filter .15s ease}
.btn.sm{min-height:36px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--marigold);color:var(--marigold-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.second{background:transparent;color:var(--cobalt);border-color:var(--cobalt)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){scale:.97}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chk{display:inline-flex;gap:8px;align-items:flex-start;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--cobalt);flex:none}
.chk.sm{font-size:13px;color:var(--muted);align-items:center}
.chk.sm input{margin:0}

/* Cartas */
.card{--cw:64px;width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.1);background:var(--paper);box-shadow:var(--shadow);position:relative;flex:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;display:block;translate:0 var(--arc,0px);rotate:var(--rot,0deg);transition:translate .18s ease,rotate .18s ease,box-shadow .18s ease}
button.card{padding:0;border:0;cursor:pointer}
@media (hover:hover){button.card:hover:not(.sel):not(.dragging){translate:0 calc(var(--arc,0px) - 6px)}}
.card svg{width:100%;height:100%;display:block;pointer-events:none}
.card.back{background-color:var(--back);background-image:radial-gradient(circle,var(--back-2) 0 1.5px,transparent 2px),repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.16) 5px 6px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(255,255,255,.16) 5px 6px);background-size:9px 9px,auto,auto;border:max(2px,calc(var(--cw)*.06)) solid var(--paper)}
.card.sel{translate:0 calc(var(--arc,0px) - 14px);box-shadow:0 0 0 3px var(--marigold),var(--shadow)}
.card.nueva{box-shadow:0 0 0 2.5px var(--marigold),var(--shadow)}
.card.dragging{rotate:0deg;translate:0 0;z-index:20;transition:none;cursor:grabbing;box-shadow:0 14px 30px rgba(10,20,50,.35)}
.card.ghost{position:fixed;margin:0;z-index:25;pointer-events:none;translate:none;rotate:none}
.pp{fill:var(--paper);stroke:var(--paper-edge);stroke-width:1.6}
.fr{fill:none;stroke-width:1.5}
.fr-o{stroke:var(--oros)}.fr-c{stroke:var(--copas)}.fr-e{stroke:var(--espadas)}.fr-b{stroke:var(--bastos)}
.ix{font-family:var(--f-display);font-weight:800;font-size:30px;text-anchor:middle;font-variant-numeric:lining-nums}
.ix-o,.so{fill:var(--oros)}.ix-c,.sc{fill:var(--copas)}.ix-e,.se{fill:var(--espadas)}.ix-b,.sb{fill:var(--bastos)}
.sk{stroke:var(--card-ink);stroke-opacity:.55;stroke-width:.7}
.sl{fill:var(--paper)}.soft{opacity:.6}
.ring{fill:none;stroke:var(--paper);stroke-width:1.1;opacity:.85}
.ln{stroke:var(--paper);stroke-width:.6;opacity:.7}
.crown{fill:var(--oros);stroke:var(--card-ink);stroke-opacity:.5;stroke-width:.8}
.fig{font-family:var(--f-display);font-weight:700;font-size:10px;letter-spacing:.06em;text-anchor:middle;fill:var(--card-ink)}
@keyframes pop{from{scale:.86;opacity:0}to{scale:1;opacity:1}}
@keyframes fadeUp{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--marigold) 22%,transparent)}}
@keyframes toastIn{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:0;width:9px;height:13px;border-radius:2px}

/* Inicio */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px 36px;padding-block:8px 48px;align-items:start}
.hero{display:grid;gap:12px;padding-top:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(60px,11vw,108px);line-height:.88;margin:0;color:var(--cobalt)}
.lede{font-size:17px;max-width:34em;margin:0}
.fan{position:relative;height:220px;margin:6px 0 2px}
.fan .card{--cw:104px;position:absolute;left:50%;bottom:0;transform-origin:50% 135%;translate:none;rotate:none}
.panels{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:25px;margin:0;line-height:1.1}
.invite{margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--marigold)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.name-in,.code-in{font:700 17px var(--f-body);padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);min-height:44px;max-width:100%}
.name-in{width:16em}
.code-in{letter-spacing:.24em;text-transform:uppercase;width:7.6em}
.opt{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:999px;min-width:44px;min-height:36px;font-weight:700;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--cobalt-ink)}
.seg.sm button{min-height:30px;min-width:0;padding:0 12px;font-size:13px}
.rules{grid-column:1/-1;border-top:1px solid var(--line);padding-top:26px;display:grid;gap:18px}
.rules h2{font-family:var(--f-display);font-size:32px;margin:0}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px 28px}
.rules-grid h3{font-family:var(--f-display);font-size:19px;margin:0 0 4px;color:var(--cobalt)}
.rules-grid p{margin:0;max-width:36em}
.pintas{display:flex;gap:8px;margin:10px 0 6px}
.pintas .card{--cw:46px}

/* Mesa */
/* La mesa ocupa justo la pantalla; --k encoge las cartas cuando no caben (lo calcula fitScreen). */
.game{--k:1;--hw:calc(min(96px,17vw)*var(--k));--mw:calc(min(56px,11vw)*var(--k));--fw:calc(min(108px,21vw)*var(--k));--sw:calc(var(--fw)*.56);--bw:calc(min(24px,6vw)*var(--k));
  max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;overflow:hidden;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.game>*{flex:none}
.game.scroll{overflow:auto}
body.in-game .top{display:none}
.tools .btn{min-height:32px;padding:6px 14px;font-size:13px}
.menu{display:grid;gap:10px;max-width:320px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.score{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.score .pl{font-weight:700}
.score b{font-family:var(--f-display);font-size:24px;color:var(--cobalt);font-variant-numeric:lining-nums tabular-nums}
.score .meta{font-size:13px;color:var(--muted)}
.net{display:inline-flex;align-items:center;gap:5px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.net.on i{background:var(--ok)}
.game>.mesa{flex:1 0 auto}
.mesa{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mesa>*{flex:none}
.mesa>.center{flex:1 0 auto}
.zone{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.who{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.who .name{font-weight:700;color:var(--ink);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.pill{background:var(--marigold);color:var(--marigold-ink);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;animation:pulse 1.8s ease-in-out infinite}
.hint{font-size:12px;color:var(--muted)}
.who .row{min-width:0;justify-content:flex-end}
.prog-wrap{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-variant-numeric:tabular-nums}
.prog-wrap>span:last-child{white-space:nowrap}
.prog{display:inline-flex;gap:3px}
.prog i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--cobalt);transition:background .3s ease}
.prog i.on{background:var(--cobalt)}
.opp-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.opp-row .melds{flex:1 1 auto;min-width:0}
.opp-hand{display:flex;align-items:flex-end;flex:none}
.opp-hand .card{--cw:var(--bw)}
.opp-hand .card+.card{margin-left:calc(var(--bw)*-.55)}
.opp-hand.shown .card{--cw:calc(var(--bw)*1.5)}
.opp-hand.shown .card+.card{margin-left:calc(var(--bw)*-.8)}
.melds{display:flex;flex-wrap:wrap;gap:10px 14px;min-height:calc(var(--mw)*1.5);align-items:flex-end}
.meld{display:flex;align-items:flex-end;position:relative}
.meld .card{--cw:var(--mw)}
.meld .card+.card{margin-left:calc(var(--mw)*-.42)}
.meld .card.sel{translate:0 -8px}
.empty{color:var(--muted);font-size:13px;font-style:italic;align-self:center}
.melds.building{padding-top:10px}
.meld.ws{padding:6px 6px 24px;border-radius:12px;border:1.5px dashed var(--line)}
.meld.ws.ok{border:1.5px solid var(--ok)}
.meld.ws.bad{border-color:var(--bad)}
.meld .badge{position:absolute;left:8px;bottom:4px;font-size:11px;font-weight:700;white-space:nowrap}
.meld.ok .badge{color:var(--ok)}.meld.bad .badge{color:var(--bad)}
.put{position:absolute;right:-6px;top:-12px;border:0;border-radius:999px;background:var(--marigold);color:var(--marigold-ink);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;z-index:2;box-shadow:var(--shadow);animation:pop .2s ease-out}
.meld-new{min-height:calc(var(--mw)*1.5 + 30px);min-width:calc(var(--mw)*1.6);border:1.5px dashed var(--marigold);border-radius:12px;background:transparent;color:var(--marigold);font-weight:700;font-size:13px;cursor:pointer;padding:6px 10px}
.meld-new.ready{animation:pop .2s ease-out}
/* Arrastrar cartas a tus juegos: se ilumina donde caería la carta. */
.drop-on{outline:3px dashed var(--marigold);outline-offset:4px;border-radius:12px}
.meld.ws.drop-on{outline-style:solid;outline-offset:2px}
.meld-new.drop-on{outline:0;border-style:solid;background:color-mix(in srgb,var(--marigold) 18%,transparent)}
.card.riding{opacity:.4}
.card.dragging[data-more]::after{content:attr(data-more);position:absolute;top:-9px;right:-9px;background:var(--marigold);color:var(--marigold-ink);font:700 12px/1 var(--f-body);border-radius:999px;padding:4px 7px;box-shadow:var(--shadow)}
.center{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 10px;align-items:center;align-content:center;padding-block:8px;border-block:1px dashed var(--line)}
.center .prompt{grid-column:1/-1}
.pile{display:grid;justify-items:center;gap:6px;font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.stack{--cw:var(--sw);position:relative;width:calc(var(--cw) + 8px);height:calc(var(--cw)*1.5 + 8px);background:none;border:0;padding:0}
.stack .card{--cw:var(--sw);position:absolute;left:0;bottom:0}
button.stack{cursor:pointer;border-radius:10px}
button.stack.live .card:last-child{box-shadow:0 0 0 3px var(--marigold),var(--shadow);animation:pulse 1.8s ease-in-out infinite}
.face{display:grid;justify-items:center;gap:6px;text-align:center}
.face .card{--cw:var(--fw)}
.face.mine .card{box-shadow:0 0 0 3px var(--marigold),var(--shadow);animation:pulse 1.8s ease-in-out infinite}
.face .tag{font-size:12px;color:var(--muted);max-width:14em}
.slot{--cw:var(--fw);width:var(--cw);height:calc(var(--cw)*1.5);border-radius:9px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.slot.sm{--cw:var(--sw)}
.prompt{margin:0;text-align:center;font-size:15px;min-height:2.9em;text-wrap:balance}
.prompt.fresh{animation:fadeUp .3s ease-out}
.prompt strong{color:var(--cobalt)}
.prompt .warn{color:var(--bad)}
.hand{display:flex;justify-content:center;align-items:flex-end;padding-top:16px;padding-bottom:4px;min-height:calc(var(--hw)*1.5 + 20px)}
.hand .card{--cw:var(--hw)}
#hand .card{touch-action:pan-y;cursor:grab}
/* Mientras puedes armar juegos, el dedo arrastra la carta en vez de deslizar la página. */
#my-melds.building .card,.game.can-use #face .card{cursor:grab;touch-action:none}
.game.building #hand .card,.game.can-use #hand .card{touch-action:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;padding-block:2px 10px;min-height:56px}
.actions.fresh .btn{animation:pop .24s ease-out}
.btn.force{background:transparent;color:var(--bad);border-color:var(--bad)}
.log{list-style:none;margin:0;padding:0 0 28px;display:grid;gap:3px;font-size:13px;color:var(--muted)}
.log li:first-child{color:var(--ink)}
.wait{max-width:560px;margin:24px auto;text-align:center;justify-items:center}
.wait p{margin:0}
.bigcode{font-family:var(--f-display);font-weight:800;font-size:64px;letter-spacing:.16em;color:var(--cobalt);line-height:1;user-select:all;-webkit-user-select:all}
.seats{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left;min-width:12em}
.seats li{display:flex;align-items:center;gap:8px;font-weight:700}
.seats li.free{font-weight:400;color:var(--muted)}
.seats i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.seats i.on{background:var(--ok);border-color:var(--ok)}
.wait .warn{color:var(--bad)}
.linkbox{font-size:13px;word-break:break-all;background:var(--surface-2);border-radius:10px;padding:8px 12px;user-select:all;-webkit-user-select:all;max-width:100%}
.center-row{justify-content:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:min(92vw,440px);box-shadow:var(--shadow);text-align:center}
#toast:not([hidden]){animation:toastIn .25s ease-out}
dialog{max-width:820px;width:calc(100% - 32px);border:0;border-radius:18px;background:var(--surface);color:var(--ink);padding:22px;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(5,10,30,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.dlg-h h2{font-family:var(--f-display);margin:0;font-size:28px}

@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr)}}
/* PC: nombres a la izquierda de cada fila y el mensaje junto a la carta, para ganar altura. */
@media (min-width:900px){
  .game{max-width:980px}
  .zone{grid-template-columns:190px minmax(0,1fr);align-items:center;column-gap:18px}
  .zone>.who{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px}
  .zone>.who .row{justify-content:flex-start}
  .center{grid-template-columns:auto auto auto minmax(220px,360px);justify-content:center;column-gap:28px}
  .center .prompt{grid-column:auto;text-align:left;font-size:16px;min-height:0}
}
@media (min-width:1100px){
  #app{max-width:1180px}
  .home{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center}
  .hero h1{font-size:88px}
  .panels{grid-template-columns:1fr 1fr;align-items:start}
  #online-panel{grid-row:span 2}
}
/* Laptops con poca altura: el inicio se encoge para caber sin deslizar. */
@media (min-width:821px) and (max-height:820px){
  .home{padding-block:0 16px;gap:20px 32px}
  .hero{gap:8px}
  .hero h1{font-size:76px}

<body>
<div id="app">
  <header class="top">
    <button type="button" class="brand" data-a="home">Conquián</button>
    <button type="button" class="btn ghost sm" data-a="rules">Reglas</button>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="rules-dlg" aria-labelledby="rules-dlg-t">
  <div class="dlg-h"><h2 id="rules-dlg-t">Cómo se juega</h2><button type="button" class="btn ghost sm" data-a="rules-close">Cerrar</button></div>
  <div id="rules-dlg-body"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
"use strict";
// ==ENGINE START==
const SUITS=['o','c','e','b'];
const SUIT_NAME={o:'oros',c:'copas',e:'espadas',b:'bastos'};
const SUIT_ORDER={o:0,c:1,e:2,b:3};
const RANKS=[1,2,3,4,5,6,7,10,11,12];
const FIG={1:'as',10:'sota',11:'caballo',12:'rey'};
const suitOf=c=>c[0];
const rankOf=c=>+c.slice(1);
const ri=c=>RANKS.indexOf(rankOf(c));
const cardName=c=>`${FIG[rankOf(c)]||rankOf(c)} de ${SUIT_NAME[suitOf(c)]}`;
const withArt=c=>(rankOf(c)===10?'la ':'el ')+cardName(c);
const pron=c=>rankOf(c)===10?'la':'lo';
const fullDeck=()=>SUITS.flatMap(s=>RANKS.map(r=>s+r));
const clone=o=>JSON.parse(JSON.stringify(o));
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

// Tercia/cuarta: mismo número. Corrida: mismo palo, seguidas (7 y sota son seguidas, no da la vuelta).
function meldKind(cs){
  if(cs.length<3)return null;
  const r=rankOf(cs[0]);
  if(cs.every(c=>rankOf(c)===r))return cs.length===3?'Tercia':cs.length===4?'Cuarta':null;
  const s=suitOf(cs[0]);
  if(!cs.every(c=>suitOf(c)===s))return null;
  const ix=cs.map(ri).sort((a,b)=>a-b);
  for(let i=1;i<ix.length;i++)if(ix[i]!==ix[i-1]+1)return null;
  return 'Corrida';
}
function sortCards(cs,by='palo'){
  const bySuit=(a,b)=>SUIT_ORDER[suitOf(a)]-SUIT_ORDER[suitOf(b)]||ri(a)-ri(b);
  const byRank=(a,b)=>ri(a)-ri(b)||SUIT_ORDER[suitOf(a)]-SUIT_ORDER[suitOf(b)];
  return cs.slice().sort(by==='palo'?bySuit:byRank);
}
function sortMeld(m){const k=meldKind(m);return sortCards(m,k==='Tercia'||k==='Cuarta'?'numero':'palo')}
const canExtend=(c,melds)=>melds.some(m=>meldKind([...m,c]));

function popcount(x){let n=0;while(x){x&=x-1;n++}return n}
function meldCandidates(cards){
  const out=[],byRank=new Map(),bySuit=new Map();
  cards.forEach((c,i)=>{
    const r=rankOf(c),s=suitOf(c);
    if(!byRank.has(r))byRank.set(r,[]);byRank.get(r).push(i);
    if(!bySuit.has(s))bySuit.set(s,[]);bySuit.get(s).push(i);
  });
  const mask=ix=>ix.reduce((m,i)=>m|(1<<i),0);
  for(const g of byRank.values()){
    if(g.length===3)out.push(mask(g));
    if(g.length===4){out.push(mask(g));for(let k=0;k<4;k++)out.push(mask(g.filter((_,j)=>j!==k)))}
  }
  for(const g0 of bySuit.values()){
    const g=g0.slice().sort((a,b)=>ri(cards[a])-ri(cards[b]));
    for(let a=0;a<g.length;a++)for(let b=a+1;b<g.length;b++){
      if(ri(cards[g[b]])!==ri(cards[g[b-1]])+1)break;
      if(b-a>=2)out.push(mask(g.slice(a,b+1)));
    }
  }
  return out;
}
// Reparte req (obligatorias en la mesa) + opt (de la mano) en juegos válidos; maximiza cartas bajadas.
function solve(req,opt,evalFn){
  const cards=[...req,...opt],n=cards.length,reqMask=(1<<req.length)-1;
  const by=Array.from({length:n},()=>[]);
  for(const m of meldCandidates(cards))for(let i=0;i<n;i++)if(m>>i&1)by[i].push(m);
  let best=null,bestScore=-Infinity;const chosen=[];
  (function rec(i,covered,skipped){
    while(i<n&&(covered>>i&1))i++;
    if(i===n){
      const melds=chosen.map(m=>cards.filter((_,k)=>m>>k&1));
      const hand=cards.filter((_,k)=>!(covered>>k&1));
      const sc=popcount(covered)*1000+(evalFn?evalFn(melds,hand):0);
      if(sc>bestScore){bestScore=sc;best={melds,hand}}
      return;
    }
    for(const m of by[i]){
      if(m&(covered|skipped))continue;
      chosen.push(m);rec(i+1,covered|m,skipped);chosen.pop();
    }
    if(!(reqMask>>i&1))rec(i+1,covered,skipped|(1<<i));
  })(0,0,0);
  return best;
}
function pairValue(a,b,gone){
  if(rankOf(a)===rankOf(b)){
    let live=0;for(const s of SUITS){const c=s+rankOf(a);if(c!==a&&c!==b&&!gone.has(c))live++}
    return live?2+live:0;
  }
  if(suitOf(a)!==suitOf(b))return 0;
  let lo=ri(a),hi=ri(b);if(lo>hi)[lo,hi]=[hi,lo];
  const s=suitOf(a),at=k=>k>=0&&k<RANKS.length?s+RANKS[k]:null,live=c=>c&&!gone.has(c);
  if(hi-lo===1){const n=(live(at(lo-1))?1:0)+(live(at(hi+1))?1:0);return n?2+n:0}
  if(hi-lo===2)return live(at(lo+1))?2:0;
  return 0;
}
function handPotential(hand,gone){let s=0;for(let i=0;i<hand.length;i++)for(let j=i+1;j<hand.length;j++)s+=pairValue(hand[i],hand[j],gone);return s}
const goneSet=S=>new Set([...S.dead,...S.melds.flat(2)]);
const preserved=(old,melds)=>old.filter(m=>melds.some(n=>m.every(c=>n.includes(c)))).length;
function bestTake(S,p,mode){
  if(!S.face)return null;
  const old=S.melds[p],f=S.face.c,gone=goneSet(S);gone.add(f);
  const evalFn=(melds,hand)=>handPotential(hand,gone)+(mode==='hint'?40*preserved(old,melds):0);
  return solve([...old.flat(),f],S.hands[p],evalFn);
}

// 2 o 3 jugadores sentados en orden; el turno, las ofertas y el cambio van hacia el siguiente lugar.
const nxt=(S,p)=>(p+1)%S.hands.length;
function deal(cfg,dealer,score=null,ties=0,round=1,seq=0){
  const n=cfg.players||2,deck=shuffle(fullDeck()),hands=Array.from({length:n},()=>[]),mano=(dealer+1)%n;
  for(let i=0;i<cfg.hand;i++)for(let k=0;k<n;k++)hands[(mano+k)%n].push(deck.pop());
  // Con "cambio", antes de voltear cada quien le da una carta al siguiente jugador.
  const cambio=!!cfg.cambio;
  return {cfg:{hand:cfg.hand,obligar:!!cfg.obligar,cambio,players:n},deck,hands,melds:hands.map(()=>[]),dead:[],face:null,phase:cambio?'swap':'flip',swap:cambio?hands.map(()=>null):null,got:null,turn:mano,offer:null,passes:0,forced:false,callable:null,winner:null,dealer,score:score?[...score]:hands.map(()=>0),ties,round,seq,log:[]};
}
// Quién actúa: voltear y pagar es del jugador en turno; decidir es de a quien se le ofrece la carta.
function actor(S){return S.phase==='flip'||S.phase==='discard'?S.turn:S.phase==='decide'?S.offer:null}
function forced(S,p){return !!(S.phase==='decide'&&S.offer===p&&S.forced)}
// Cualquiera puede gritar "¡Te obligo!" sobre la última carta que pasó otro jugador, hasta que alguien más la pase o se voltee la siguiente.
function canCall(S,p){return !!(S.callable&&S.callable.by!==p&&S.phase!=='over')}
function takeProblem(S,p,melds,hand){
  if(!Array.isArray(melds)||!Array.isArray(hand)||!melds.every(Array.isArray))return 'Jugada mal formada.';
  const f=S.face.c;
  const before=[...S.hands[p],...S.melds[p].flat(),f].sort().join();
  const after=[...hand,...melds.flat()].sort().join();
  if(before!==after)return 'Las cartas no cuadran con tu mano y tus juegos.';
  const fixed=new Set([...S.melds[p].flat(),f]);
  if(hand.some(c=>fixed.has(c)))return 'Las cartas de la mesa no pueden regresar a tu mano.';
  if(melds.some(m=>!meldKind(m)))return 'Todos tus juegos deben ser tercias o corridas de 3 cartas o más.';
  return null;
}
function act(S0,p,a){
  if(!a||typeof a!=='object')throw new Error('Jugada desconocida.');
  if(a.t==='next'){
    if(S0.phase!=='over')throw new Error('La mano todavía no termina.');
    return deal({...S0.cfg,players:S0.hands.length},nxt(S0,S0.dealer),S0.score,S0.ties,S0.round+1,S0.seq+1);
  }
  // El cambio de carta lo hacen todos al mismo tiempo; se entregan cuando todos ya escogieron.
  if(a.t==='swap'){
    if(S0.phase!=='swap'||!S0.swap||S0.swap[p]!=null)throw new Error('Ya escogiste tu carta para el cambio.');
    if(!S0.hands[p].includes(a.c))throw new Error('Esa carta no está en tu mano.');
    const S=clone(S0);S.swap[p]=a.c;
    if(S.swap.every(c=>c!=null)){
      const given=S.swap,n=S.hands.length,from=i=>given[(i+n-1)%n];
      S.hands=S.hands.map((h,i)=>h.filter(c=>c!==given[i]).concat(from(i)));
      S.got=S.hands.map((_,i)=>from(i));S.swap=null;S.phase='flip';
      S.log.push({p,k:'swapdone'});if(S.log.length>40)S.log.shift();
    }
    S.seq++;
    return S;
  }
  // "¡Te obligo!" se puede decir fuera de turno; todo lo demás, solo en tu turno.
  if(a.t!=='force'&&actor(S0)!==p)throw new Error('No es tu turno.');
  const S=clone(S0),n=S.hands.length;
  // q: a quién se quiso obligar.
  const log=(k,c,q)=>{const e={p,k};if(c)e.c=c;if(q!=null)e.q=q;S.log.push(e);if(S.log.length>40)S.log.shift()};
  if(a.t==='force'){
    if(!canCall(S0,p))throw new Error('Ya no se puede obligar: ya se volteó otra carta.');
    const cl=S.callable,q=cl.by;S.callable=null;
    if(canExtend(cl.c,S.melds[q])){
      // Si ya se había ido a las muertas, regresa a la mesa.
      if(!S.face||S.face.c!==cl.c){const i=S.dead.lastIndexOf(cl.c);if(i>=0)S.dead.splice(i,1);S.face=cl.face}
      S.offer=q;S.phase='decide';S.forced=true;log('force',cl.c,q);
    }else log('badforce',cl.c,q);
  }else if(a.t==='flip'){
    if(S.phase!=='flip')throw new Error('Ahora no se voltea.');
    S.callable=null;
    if(!S.deck.length){S.phase='over';S.winner=-1;S.ties++;log('tablas')}
    else{const c=S.deck.pop();S.face={c,src:'monte',by:p};S.offer=p;S.passes=0;S.forced=false;S.phase='decide';log('flip',c)}
  }else if(a.t==='pass'){
    if(S.phase!=='decide')throw new Error('No hay carta que pasar.');
    if(forced(S,p))throw new Error('Te obligaron: tienes que tomar esa carta.');
    const c=S.face.c;log('pass',c);
    // La carta pasada queda en juego para que el rival pueda obligar, si quien la pasó tiene juegos bajados.
    S.callable=S.cfg.obligar&&S.melds[p].length?{c,by:p,face:{...S.face}}:null;
    S.forced=false;S.passes++;
    // La del monte se le ofrece a todos empezando por quien la volteó; la pagada, a todos menos a quien la pagó.
    // Si nadie la quiere se va a las muertas y voltea el que sigue de quien la sacó.
    if(S.passes<(S.face.src==='monte'?n:n-1))S.offer=nxt(S,p);
    else{S.dead.push(c);S.turn=nxt(S,S.face.by);S.face=null;S.offer=null;S.phase='flip'}
  }else if(a.t==='take'){
    if(S.phase!=='decide')throw new Error('No hay carta que tomar.');
    const err=takeProblem(S,p,a.melds,a.hand);if(err)throw new Error(err);
    const c=S.face.c;
    S.melds[p]=a.melds.map(sortMeld);S.hands[p]=a.hand.slice();S.face=null;S.offer=null;S.forced=false;S.callable=null;log('take',c);
    if(!S.hands[p].length){S.phase='over';S.winner=p;S.score[p]++;log('win')}
    else{S.phase='discard';S.turn=p}
  }else if(a.t==='pay'){
    if(S.phase!=='discard')throw new Error('Ahora no se paga.');
    const i=S.hands[p].indexOf(a.c);if(i<0)throw new Error('Esa carta no está en tu mano.');
    S.hands[p].splice(i,1);S.face={c:a.c,src:'pago',by:p};S.offer=nxt(S,p);S.passes=0;S.forced=false;S.callable=null;S.phase='decide';log('pay',a.c);
  }else throw new Error('Jugada desconocida.');
  S.seq++;
  return S;
}
function aiDiscard(S,p){
  const hand=S.hands[p],gone=goneSet(S),opp=S.melds.filter((_,i)=>i!==p).flat(1);
  let best=hand[0],bv=Infinity;
  for(const c of hand){
    let v=0;for(const d of hand)if(d!==c)v+=pairValue(c,d,gone);
    if(canExtend(c,opp))v+=100;
    v+=Math.random()*.8;
    if(v<bv){bv=v;best=c}
  }
  return best;
}
// La computadora se da cuenta casi siempre, pero no siempre, de que te puede obligar.
const aiWantsForce=(S,p)=>canCall(S,p)&&canExtend(S.callable.c,S.melds[S.callable.by])&&Math.random()<.85;
function aiChoose(S,p){
  if(S.phase==='over')return null;
  if(S.phase==='swap')return S.swap&&S.swap[p]==null?{t:'swap',c:aiDiscard(S,p)}:null;
  if(aiWantsForce(S,p))return {t:'force'};
  if(actor(S)!==p)return null;
  if(S.phase==='flip')return {t:'flip'};
  if(S.phase==='decide'){
    const b=bestTake(S,p,'ai');
    if(!b)return {t:'pass'};
    // A veces no se da cuenta de que una carta suelta le queda a sus juegos.
    const onlyAdds=b.melds.flat().length-S.melds[p].flat().length===1;
    if(!S.forced&&S.cfg.obligar&&onlyAdds&&canExtend(S.face.c,S.melds[p])&&Math.random()<.12)return {t:'pass'};
    return {t:'take',melds:b.melds,hand:b.hand};
  }
  if(S.phase==='discard')return {t:'pay',c:aiDiscard(S,p)};
  return null;
}
// ==ENGINE END==

// ===== Dibujo de las cartas =====
const PIPS={1:[[50,75]],2:[[50,42],[50,108]],3:[[50,36],[50,75],[50,114]],4:[[37,42],[63,42],[37,108],[63,108]],5:[[37,40],[63,40],[50,75],[37,110],[63,110]],6:[[37,38],[63,38],[37,75],[63,75],[37,112],[63,112]],7:[[37,36],[63,36],[50,57],[37,78],[63,78],[37,114],[63,114]]};
const ICON={
  o:'<circle cx="10" cy="10" r="9" class="so sk"/><circle cx="10" cy="10" r="5.9" class="ring"/><circle cx="10" cy="10" r="2.1" class="sl"/>',
  c:'<path d="M3 3.4h14c0 5-2.9 7.8-7 8-4.1-.2-7-3-7-8z" class="sc sk"/><ellipse cx="10" cy="3.4" rx="7" ry="1.5" class="sc sk"/><ellipse cx="10" cy="3.4" rx="5.2" ry=".75" class="sl soft"/><path d="M8.9 11.2h2.2v3.7H8.9z" class="sc"/><path d="M5 18.8c0-2.1 2.2-3.5 5-3.5s5 1.4 5 3.5z" class="sc sk"/>',
  e:'<path d="M10 .5l1.9 3.2v9.5H8.1V3.7z" class="se sk"/><path d="M10 3.6v9.2" class="ln"/><rect x="3.4" y="13.1" width="13.2" height="2.1" rx="1" class="se sk"/><path d="M9 15.2h2v3.2H9z" class="se"/><circle cx="10" cy="19" r="1.2" class="se"/>',
  b:'<path d="M8.4 19.5C8.1 13.7 6.1 8.7 6.3 5.2 6.5 2.3 8.1.8 10 .8s3.5 1.5 3.7 4.4c.2 3.5-1.8 8.5-2.1 14.3z" class="sb sk"/><ellipse cx="8.2" cy="6.1" rx="1.05" ry=".7" class="sl soft"/><ellipse cx="11.9" cy="9.3" rx="1.05" ry=".7" class="sl soft"/><ellipse cx="9.1" cy="12.9" rx=".95" ry=".65" class="sl soft"/>'
};
function icon(s,x,y,size){return `<g transform="translate(${(x-size/2).toFixed(2)} ${(y-size/2).toFixed(2)}) scale(${(size/20).toFixed(3)})">${ICON[s]}</g>`}
// La "pinta": cortes en el marco. Oros ninguno, copas uno, espadas dos, bastos tres.
function frame(s){
  const n={o:0,c:1,e:2,b:3}[s],xs=[6];
  for(let k=1;k<=n;k++){const cx=6+88*k/(n+1);xs.push(cx-4,cx+4)}
  xs.push(94);
  let d='M6 6V144M94 6V144';
  for(let i=0;i<xs.length;i+=2)d+=`M${xs[i].toFixed(1)} 6H${xs[i+1].toFixed(1)}M${xs[i].toFixed(1)} 144H${xs[i+1].toFixed(1)}`;
  return `<path d="${d}" class="fr fr-${s}"/>`;
}
function buildFace(c){
  const s=suitOf(c),r=rankOf(c);
  const idx=`<text x="18" y="34" class="ix ix-${s}">${r}</text>${icon(s,18,47,14)}`;
  let mid;
  if(r<=7)mid=PIPS[r].map(([x,y])=>icon(s,x,y,r===1?46:18)).join('');
  else mid=(r===12?'<path d="M37 46l3-11 6 6 4-8 4 8 6-6 3 11z" class="crown"/>':'')+icon(s,50,63,28)+`<text x="50" y="93" class="fig">${FIG[r].toUpperCase()}</text>`;
  return `<svg viewBox="0 0 100 150" aria-hidden="true" focusable="false"><rect x=".8" y=".8" width="98.4" height="148.4" rx="9" class="pp"/>${frame(s)}${idx}<g transform="rotate(180 50 75)">${idx}</g>${mid}</svg>`;
}
const svgCache=new Map();
const validCard=c=>typeof c==='string'&&SUITS.includes(c[0])&&RANKS.includes(+c.slice(1))&&String(+c.slice(1))===c.slice(1);
function faceSVG(c){if(!validCard(c))return '';if(!svgCache.has(c))svgCache.set(c,buildFace(c));return svgCache.get(c)}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function cardHTML(c,{act='',cls='',style='',key=true}={}){
  if(!validCard(c))return '';
  const name=cap(cardName(c)),st=style?` style="${style}"`:'',k=key?` data-k="${c}"`:'';
  if(act)return `<button type="button" class="card ${cls}" data-a="${act}" data-c="${c}"${k} aria-label="${name}" aria-pressed="${/\bsel\b/.test(cls)}"${st}>${faceSVG(c)}</button>`;
  return `<div class="card ${cls}" role="img" aria-label="${name}"${k}${st}>${faceSVG(c)}</div>`;
}
const backHTML=(style='')=>`<div class="card back" aria-hidden="true"${style?` style="${style}"`:''}></div>`;

// ===== Estado de la página =====
const $=s=>document.querySelector(s);
const view=$('#view');
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const store={
  get(k,d){try{const v=localStorage.getItem('conquian.'+k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem('conquian.'+k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem('conquian.'+k)}catch{}}
};
const savedCfg=store.get('cfg',{});
const savedOrder=store.get('order',null);
const app={
  view:'home',mode:null,S:null,me:0,rendered:null,lastActs:'',lastPrompt:'',
  sortBy:store.get('sort','palo'),
  sound:store.get('sound',true),
  order:savedOrder&&Array.isArray(savedOrder.list)?savedOrder:{key:'',list:[]},
  cfg:{hand:[8,9,10].includes(savedCfg.hand)?savedCfg.hand:8,obligar:savedCfg.obligar!==false,cambio:savedCfg.cambio!==false},
  ui:{build:null,paySel:null,busy:false}
};
const loadLocal=()=>{const S=store.get('local',null);return S&&S.hands&&S.cfg?S:null};
const saveLocal=()=>store.set('local',app.S);
const FAN=['e7','c12','o1','b11','c3'];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

function shortOf(p){return app.mode==='local'?'Compu':nameOf(p).split(' ')[0]}

let toastT;
function toast(msg){const t=$('#toast');t.hidden=true;void t.offsetWidth;t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3600)}

// ===== Orden de la mano (lo acomoda cada quien a su gusto) =====
function orderKey(){return [app.mode,net.code,app.S.round].join('|')}
function orderedHand(cards){
  const key=orderKey();
  if(app.order.key!==key)app.order={key,list:[]};
  const pos=new Map(app.order.list.map((c,i)=>[c,i]));
  const known=cards.filter(c=>pos.has(c)).sort((a,b)=>pos.get(a)-pos.get(b));
  const fresh=sortCards(cards.filter(c=>!pos.has(c)),app.sortBy);
  return [...known,...fresh];
}
function setOrder(ids){app.order.list=[...ids,...app.order.list.filter(c=>!ids.includes(c))];store.set('order',app.order)}
const currentHand=()=>app.ui.build?app.ui.build.hand:app.S.hands[app.me];

// ===== Sonidos (cortos y suaves, hechos en el momento) =====
let actx=null;
function audio(){
  if(!app.sound)return null;
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC()}
    if(actx.state==='suspended')actx.resume();
    return actx;
  }catch{return null}
}
function snap(t0=0,vol=.3){
  const ctx=audio();if(!ctx)return;
  const t=ctx.currentTime+t0,len=Math.floor(ctx.sampleRate*.07),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=2300;f.Q.value=.8;g.gain.value=vol;
  src.connect(f).connect(g).connect(ctx.destination);src.start(t);
}
function tone(freq,t0=0,dur=.2,vol=.1,type='triangle'){
  const ctx=audio();if(!ctx)return;
  const t=ctx.currentTime+t0,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+dur+.03);
}
const SFX={
  card:(v=.3)=>snap(0,v),
  deal:n=>{for(let i=0;i<n*2;i++)snap(i*.055,.18)},
  win:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.12,.4,.11)),
  lose:()=>{tone(392,0,.32,.08);tone(311.13,.2,.45,.08)},
  force:()=>{tone(740,0,.12,.1,'square');tone(988,.1,.22,.09,'square')},
  buzz:()=>tone(150,0,.25,.08,'sawtooth'),
  turn:()=>tone(880,0,.14,.05,'sine')
};
window.addEventListener('pointerdown',()=>audio(),{once:true});

// ===== Animaciones =====
const rectOf=sel=>{const el=view.querySelector(sel);return el?el.getBoundingClientRect():null};
// Punto de salida del tamaño de una carta, aunque el lugar sea una fila completa.
function cardSpot(sel,w=34){
  const r=rectOf(sel);if(!r)return null;
  const [cx,cy]=center(r);
  return {left:cx-w/2,top:cy-w*.75,width:w,height:w*1.5};
}
const center=r=>[r.left+r.width/2,r.top+r.height/2];
function flyFrom(el,from,to,{dur=430,delay=0,fade=false}={}){
  if(!from||!to||!to.width)return;
  const [fx,fy]=center(from),[tx,ty]=center(to),dx=fx-tx,dy=fy-ty,s=from.width/to.width;
  if(Math.abs(dx)<1&&Math.abs(dy)<1&&Math.abs(s-1)<.02)return;
  const k0={transform:`translate(${dx}px,${dy}px) scale(${s})`};if(fade)k0.opacity=.35;
  el.animate([k0,{transform:'none',opacity:1}],{duration:dur,delay,easing:'cubic-bezier(.2,.75,.25,1)',fill:'backwards'});
}
// Un dorso que viaja de un lugar a otro (al voltear, al pagar el rival, al irse a las muertas).
function ghost(from,to,{dur=440,flipOut=false}={}){
  if(!from||!to)return;
  const g=document.createElement('div');g.className='card back ghost';
  g.style.cssText=`left:${from.left}px;top:${from.top}px;--cw:${from.width}px`;
  document.body.appendChild(g);
  const [fx,fy]=center(from),[tx,ty]=center(to),end=`translate(${tx-fx}px,${ty-fy}px) scale(${to.width/from.width})`;
  const kf=flipOut
    ?[{transform:'none'},{transform:end,offset:.5},{transform:end+' perspective(700px) rotateY(90deg)',offset:.68},{transform:end+' perspective(700px) rotateY(90deg)',opacity:0,offset:1}]
    :[{transform:'none'},{transform:end,opacity:.85}];
  const a=g.animate(kf,{duration:dur,easing:'ease-in-out',fill:'forwards'});
  a.onfinish=()=>g.remove();setTimeout(()=>g.remove(),dur+500);
}
function revealFrom(el,src,to){
  const T=640;
  if(src)ghost(src,to,{dur:T,flipOut:true});
  const hide='perspective(700px) rotateY(-90deg)';
  el.animate(src
    ?[{opacity:0,transform:hide,offset:0},{opacity:0,transform:hide,offset:.67},{opacity:1,transform:hide,offset:.68},{opacity:1,transform:'none',offset:1}]
    :[{opacity:0,transform:hide},{opacity:1,transform:'none'}],{duration:src?T:300,easing:'ease-out'});
}
function confetti(){
  if(reduceMotion)return;
  const box=document.createElement('div');box.className='confetti';
  const colors=['var(--marigold)','var(--copas)','var(--cobalt)','var(--bastos)','var(--oros)'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];
    box.appendChild(p);
    const dur=1900+Math.random()*1500;
    p.animate([{transform:'translate(0,-20px) rotate(0deg)'},{transform:`translate(${(Math.random()-.5)*200}px,105vh) rotate(${Math.random()*900-450}deg)`}],{duration:dur,delay:Math.random()*600,easing:'cubic-bezier(.25,.5,.5,1)',fill:'both'});
  }
  document.body.appendChild(box);setTimeout(()=>box.remove(),4000);
}
function capture(){
  if(!app.rendered||!view.querySelector('.game'))return null;
  const rects=new Map();view.querySelectorAll('[data-k]').forEach(el=>rects.set(el.dataset.k,el.getBoundingClientRect()));
  return {...app.rendered,rects};
}
function afterGame(prev){
  const S=app.S,me=app.me;
  const same=!!prev&&prev.mode===app.mode&&prev.code===net.code;
  const newRound=!same||prev.round!==S.round;
  const stepped=same&&!newRound&&prev.seq!==S.seq;
  if(newRound)SFX.deal(Math.min(8,S.cfg.hand));
  else if(stepped){
    const last=S.log[S.log.length-1]||{};
    if(S.phase==='over'&&prev.phase!=='over'){if(S.winner===me){SFX.win();confetti()}else SFX.lose()}
    else if(last.k==='force')SFX.force();
    else if(last.k==='badforce')SFX.buzz();
    else if(S.face)SFX.card();
    else SFX.card(.14);
    if(last.k==='force'||last.k==='badforce'){const d=document.createElement('div');d.innerHTML=logText(last);toast(d.textContent)}
    if(app.mode==='p2p'&&actor(S)===me&&prev.actor!==me&&S.phase!=='over')setTimeout(SFX.turn,250);
  }
  if(reduceMotion)return;
  const deckR=rectOf('#deck .card:last-child')||cardSpot('#deck',44),deadR=rectOf('#dead .card')||cardSpot('#dead',44);
  const handR=p=>rectOf(`#opp-hand-${p} .card:last-child`)||cardSpot(`#opp-hand-${p}`,30);
  const present=new Set();let di=0;
  view.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;present.add(k);
    const to=el.getBoundingClientRect();
    if(newRound){if(el.closest('#hand'))flyFrom(el,deckR,to,{dur:480,delay:110*di++,fade:true});return}
    const from=prev&&prev.rects.get(k);
    if(from){flyFrom(el,from,to);return}
    if(!prev)return;
    if(el.closest('#face')){revealFrom(el,!S.face||S.face.src==='monte'?deckR:handR(S.face.by),to);return}
    const om=el.closest('.opp-melds');
    if(om){flyFrom(el,handR(+om.dataset.seat),to,{fade:true});return}
    // La carta que te dieron en el cambio llega desde la mano de quien juega antes que tú.
    if(el.closest('#hand')&&prev.phase==='swap'){flyFrom(el,handR((me+S.hands.length-1)%S.hands.length),to,{dur:560,fade:true});return}
    el.animate([{opacity:0},{opacity:1}],{duration:260});
  });
  if(newRound)view.querySelectorAll('.opp-hand .card.back').forEach((el,i)=>flyFrom(el,deckR,el.getBoundingClientRect(),{dur:480,delay:110*i+55,fade:true}));
  if(prev&&!newRound)for(const [k,r] of prev.rects){
    if(present.has(k))continue;
    if(S.dead.includes(k))ghost(r,deadR);
    else if(prev.phase==='swap'&&S.phase!=='swap')ghost(r,handR(nxt(S,me)),{dur:560});
  }
}

function rulesHTML(){
  return `<div class="rules-grid">
    <div><h3>La baraja</h3><p>40 cartas en cuatro palos: oros, copas, espadas y bastos. Cada palo va del 1 al 7 y luego sota (10), caballo (11) y rey (12). Después del 7 sigue la sota.</p>
      <div class="pintas" aria-hidden="true">${['o3','c3','e3','b3'].map(c=>cardHTML(c,{key:false})).join('')}</div>
      <small>Fíjate en el marco: los oros no tienen cortes, las copas uno, las espadas dos y los bastos tres.</small></div>
    <div><h3>El cambio</h3><p>Al empezar cada mano, cada quien escoge una carta de su mano y se la da boca abajo al siguiente jugador (entre dos, a su rival). Todas se entregan al mismo tiempo, así que nadie sabe qué le van a dar. Se puede quitar en las reglas de la mesa.</p></div>
    <div><h3>La meta</h3><p>Cada quien recibe 8 cartas. Gana el primero que baje 9 en juegos: todas las de su mano más una que tome de la mesa. Si juegan con 9 o 10 cartas, se gana con 10 u 11. En línea pueden jugar 2 o 3; entre 3, con 10 cartas el monte se acaba pronto.</p></div>
    <div><h3>Los juegos</h3><p><b>Tercia</b>: 3 o 4 cartas del mismo número, como tres reyes. <b>Corrida</b>: 3 o más cartas seguidas del mismo palo, como 6, 7 y sota de copas. No da la vuelta: después del rey no sigue el as.</p></div>
    <div><h3>Tu turno</h3><p>Volteas la carta de arriba del monte. Si te sirve, la bajas en un juego junto con cartas de tu mano y luego <b>pagas</b>: tiras una carta para tu rival. Las cartas nunca se guardan en la mano.</p></div>
    <div><h3>Pasar</h3><p>Si la carta no te sirve, la pasas y el siguiente jugador puede usarla, y así en orden. Si nadie la quiere, se va a las muertas y voltea el que sigue de quien la sacó. La carta que pagas se le ofrece a todos menos a ti.</p></div>
    <div><h3>Acomodar</h3><p>Al bajar puedes reacomodar tus juegos. Si volteas el 6 de copas y tienes el 4 de copas, puedes sacar el 5 de copas de tu cuarta de cincos y armar la corrida 4, 5 y 6. Arrastra cada carta al juego donde la quieres, o tócalas y luego «Aquí».</p></div>
    <div><h3>Obligar</h3><p>Si alguien pasa una carta que le queda directo a uno de sus juegos bajados, cualquier otro puede decir <b>«¡Te obligo!»</b> antes de que otro la pase o se voltee la siguiente: la tiene que tomar y pagar otra. Nadie te avisa, te tienes que dar cuenta tú. Si te equivocas, no pasa nada y sigue el juego.</p></div>
    <div><h3>Tablas</h3><p>Si se acaba el monte y nadie bajó todo, la mano queda en tablas y se reparte otra vez.</p></div>
  </div>`;
}

function render(){
  if(drag&&drag.active)endDrag(null);
  const prev=capture();
  if(app.view!=='game')app.rendered=null;
  document.body.classList.toggle('in-game',app.view==='game'&&!!app.S);
  if(app.view==='home')renderHome();
  else if(app.view==='wait')renderWaiting();
  else if(app.view==='loading')view.innerHTML=`<section class="panel wait"><p class="sub">${esc(net.status||'Conectando…')}</p><button type="button" class="btn ghost sm" data-a="home">Cancelar</button></section>`;
  else if(app.view==='game'&&app.S){renderGame();afterGame(prev)}
  scheduleAuto();
}

function progHTML(n,t){return `<span class="prog" aria-hidden="true">${Array.from({length:t},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`}
const justSwapped=S=>!!(S.got&&S.phase==='flip'&&(S.log[S.log.length-1]||{}).k==='swapdone');
const swapWaiting=(S,p)=>S.phase==='swap'&&!!S.swap&&S.swap[p]==null;
// Quién obligó en la jugada actual (el último "¡Te obligo!" que sí contó).
function forcer(S){for(let i=S.log.length-1;i>=0;i--)if(S.log[i].k==='force')return S.log[i].p;return nxt(S,app.me)}
function lastTaken(S){const L=S.log.slice(-2);for(let i=L.length-1;i>=0;i--)if(L[i].k==='take')return L[i];return null}

function handHTML(){
  const S=app.S,ui=app.ui,ws=ui.build;
  const cards=orderedHand(currentHand());
  if(!cards.length)return `<span class="empty">${S.phase==='over'?'Sin cartas en mano':'Ya bajaste todas: espera una carta que le quede a tus juegos.'}</span>`;
  const got=justSwapped(S)?S.got[app.me]:null,given=S.phase==='swap'&&S.swap?S.swap[app.me]:null;
  return cards.map(c=>cardHTML(c,{act:'tap',cls:((ws?ws.sel.includes(c):ui.paySel===c||c===given)?'sel ':'')+(c===got?'nueva':'')})).join('');

function centerHTML(extra=''){

  const monte=canFlip?`<button type="button" class="stack live" id="deck" data-a="flip" aria-label="Voltear carta del monte">${inner}</button>`:`<div class="stack" id="deck">${inner}</div>`;
  let mid;

    const f=S.face,mine=f.by===me;

    <div class="pile">${monte}<span>Monte · ${S.deck.length}</span></div>

function buildProblem(){
  const ws=app.ui.build;if(!ws)return '';
  const bad=ws.melds.filter(m=>!meldKind(m));
  if(!bad.length)return '';

}
function promptHTML(){
  const S=app.S,me=app.me,ui=app.ui,n=S.hands.length;
  if(!linked()){
    if(!online())return `<span class="warn">${netProblem()}</span>`;
    const m=missing(),many=m.length>1;
    return `${joinNames(m.map(p=>who(p)))} ${many?'no están conectados':'no está conectado'}. ${net.role==='host'?`${many?'Pueden':'Puede'} volver a entrar con el código <strong>${esc(net.code)}</strong>.`:`La partida sigue cuando ${many?'vuelvan':'vuelva'}.`}`;
  }
  if(ui.build){
    const ws=ui.build,prob=buildProblem();
    if(!ws.moves)return `<strong>Arrastra</strong> tus cartas a un juego para armarlo con ${withArt(ws.face)}, o tócalas y luego <strong>Aquí</strong>.`;
    return prob?`<span class="warn">${prob}</span>`:'Todo cuadra. Toca <strong>Bajar</strong> para confirmar.';
  }
  if(S.phase==='over')return S.winner===-1?'Se acabó el monte y nadie bajó todo: <strong>tablas</strong>.':S.winner===me?'<strong>¡Ganaste la mano!</strong>':`<strong>${who(S.winner)} ganó la mano.</strong>`;
  if(S.phase==='swap'){
    const to=nxt(S,me),from=(me+n-1)%n;
    if(swapWaiting(S,me))return `<strong>Cambio de carta:</strong> escoge una carta de tu mano para dársela a ${who(to,true)}. ${to===from?'Te va a dar una a cambio.':`${who(from)} te va a dar una a ti.`}`;
    const wait=S.hands.map((_,i)=>i).filter(i=>i!==me&&swapWaiting(S,i));
    return `Ya escogiste. Esperando a que ${joinNames(wait.map(p=>who(p,true)))} ${wait.length>1?'escojan':'escoja'} la suya…`;
  }
  if(S.phase==='flip'){
    const lp=S.callable&&!S.face?S.callable:null,pc=lp?`<strong>${withArt(lp.c)}</strong>`:'';
    const sw=justSwapped(S)?`Te dieron <strong>${withArt(S.got[me])}</strong>. `:'';
    const passed=lp?(lp.by===me?`Pasaste ${pc}. `:`${who(lp.by)} pasó ${pc}. `):'';
    if(S.turn===me){
      const go=S.deck.length?'Te toca <strong>voltear</strong> una carta del monte.':'Ya no hay monte: toca <strong>Cerrar la mano</strong>.';
      return sw+passed+go;
    }
    return sw+passed+(lp&&lp.by===S.turn?'Ahora le toca voltear.':`Turno de ${who(S.turn,true)}…`);
  }
  if(S.phase==='discard'){
    if(S.turn!==me)return `${who(S.turn)} bajó y ahora va a pagar…`;
    return 'Ahora <strong>paga</strong> una carta: tócala en tu mano. Arrastra las cartas para acomodarlas.';
  }
  const f=S.face,c=`<strong>${withArt(f.c)}</strong>`;
  // Quiénes ya la pasaron: la del monte empieza por quien la volteó; la pagada, por el siguiente.
  const ps=Array.from({length:S.passes},(_,i)=>(f.by+(f.src==='monte'?0:1)+i)%n);
  let origin;
  if(f.src==='monte'&&ps.length===1)origin=f.by===me?`Volteaste ${c} y ${pron(f.c)} pasaste.`:`${who(f.by)} volteó ${c} y ${pron(f.c)} pasó.`;
  else{
    origin=f.src==='pago'?(f.by===me?`Pagaste ${c}.`:`${who(f.by)} pagó ${c}.`):(f.by===me?`Volteaste ${c}.`:`${who(f.by)} volteó ${c}.`);
    if(ps.length)origin+=` ${cap(pron(f.c))} ${ps.length>1?'pasaron':ps[0]===me?'pasaste':'pasó'} ${joinNames(ps.map(p=>p===me?'tú':who(p)))}.`;
  }
  if(S.offer!==me){
    if(!S.forced)return `${origin} ${who(S.offer)} está decidiendo…`;
    const by=forcer(S);
    return by===me?`¡Obligaste a ${who(S.offer,true)}! Tiene que tomar ${c}.`:`¡${who(by)} obligó a ${who(S.offer,true)} a tomar ${c}!`;
  }
  if(forced(S,me))return `¡${who(forcer(S))} te obligó! Tienes que tomar ${c}.`;
  return `${origin} <strong>¿La usas o la pasas?</strong>`;
}
function actionsHTML(){
  const S=app.S,me=app.me,ui=app.ui;
  if(!linked())return net.role==='guest'&&!online()?'<button type="button" class="btn primary" data-a="rejoin">Volver a conectar</button><button type="button" class="btn ghost" data-a="home">Salir</button>':'';
  if(ui.busy)return '<span class="sub">Enviando jugada…</span>';
  if(ui.build)return `<button type="button" class="btn primary" data-a="b-confirm" ${buildProblem()?'disabled':''}>Bajar</button>
    ${ui.build.sel.length&&ui.build.sel.every(c=>ui.build.fromHand.includes(c))?'<button type="button" class="btn second" data-a="put" data-i="hand">A la mano</button>':''}

  return '';
}
function logText(e){
  const me=app.me,mine=e.p===me,w=who(e.p),c=e.c&&validCard(e.c)?withArt(e.c):'';
  // Las partidas guardadas de antes no traen q: eran de dos jugadores.

  switch(e.k){
    case 'flip':return mine?`Volteaste ${c}.`:`${w} volteó ${c}.`;
    case 'pass':return mine?`Pasaste ${c}.`:`${w} pasó ${c}.`;
    case 'take':return mine?`Bajaste con ${c}.`:`${w} bajó con ${c}.`;
    case 'pay':return mine?`Pagaste ${c}.`:`${w} pagó ${c}.`;
    case 'force':return mine?`¡Obligaste a ${qm} a tomar ${c}!`:q===me?`¡${w} te obligó a tomar ${c}!`:`¡${w} obligó a ${qm} a tomar ${c}!`;
    case 'badforce':return mine?`Quisiste obligar, pero ${c} no le quedaba a ${qm}.`:q===me?`${w} quiso obligarte, pero ${c} no te quedaba.`:`${w} quiso obligar a ${qm}, pero ${c} no le quedaba.`;
    case 'swapdone':return app.S&&app.S.got&&validCard(app.S.got[me])?`Cambiaron una carta: te dieron ${withArt(app.S.got[me])}.`:'Cambiaron una carta.';
    case 'win':return mine?'Ganaste la mano.':`${w} ganó la mano.`;
    case 'tablas':return 'Se acabó el monte: tablas.';
  }
  return '';
}
